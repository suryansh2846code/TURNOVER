<!doctype html>
<meta charset="utf-8">
<title>Connect</title>
<style>
  :root {
    --bg: #1c1c1e;
    --card: #2a2a2c;
    --text: #f2f2f7;
    --muted: #98989f;
    --line: rgba(255,255,255,.10);
    --accent: #4fb3a0;
    --danger: #ff6b5e;
    --pad: 17px;                 /* one padding value, used on every edge */
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  /* The window itself is transparent, so the rounded card IS the card — there
     is no opaque window backing to show as a pale border around it. The body
     padding is the room the shadow needs to render, nothing more. */
  /* overflow:hidden is load-bearing. If the window is ever a pixel shorter
     than the card a scrollbar appears, which narrows the body, rewraps the
     text and makes the card taller — so the window chases a height that keeps
     moving away from it. */
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--sans);
    color: var(--text);
    display: flex;
    /* No gutter: the shadow is the real macOS window shadow, drawn outside the
       window by the window server, so the card fills the window edge to edge
       and every pixel of it is card. */
    padding: 0;
    /* Let the card be exactly as tall as its content instead of stretching to
       the window; `fit()` then trims the window to match. */
    align-items: flex-start;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .card {
    position: relative;
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    animation: rise .22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } }

  /* Every block below starts and ends on the same two vertical lines — the
     icon used to sit in a column of its own, which left the title indented
     past the body text under it. */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding-right: 34px;                 /* clear of the close button */
    margin-bottom: 11px;
  }
  .brand {
    width: 30px; height: 30px; flex: none;
    border-radius: 9px;
    background: var(--card);
    display: grid; place-items: center;
  }
  .brand svg { width: 17px; height: 17px; fill: var(--text); }
  .status {
    display: flex; align-items: center; gap: 7px; min-width: 0;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
  }
  .status > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { font-size: 16px; line-height: 1.3; margin: 0; font-weight: 600; letter-spacing: -.2px; }
  p.body { margin: 7px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }

  /* Same inset from the top and right edges as the card's own padding, so it
     sits on the diagonal of the corner rather than near it. */
  .close {
    position: absolute; top: var(--pad); right: var(--pad);
    width: 26px; height: 26px; border: 0; border-radius: 50%;
    background: var(--card); color: var(--text);
    font-size: 14px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  .close:hover { background: #3a3a3d; }

  .action {
    /* A fixed gap, not a spring. Letting this margin absorb the leftover
       space shoved the button to the bottom of the window and left a hole
       under the text whenever the copy was short. */
    margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--card); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .action:hover { background: #343437; }
  .action.primary { background: var(--accent); border-color: transparent; color: #08302a; font-weight: 600; }
  .action.primary:hover { filter: brightness(1.06); }
  .action svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }

  /* Loader: three dots tracing a small arc, matching the reference */
  .loader { width: 14px; height: 14px; flex: none; position: relative; }
  .loader i {
    position: absolute; top: 50%; left: 50%;
    width: 3.5px; height: 3.5px; margin: -1.75px; border-radius: 50%;
    background: var(--muted);
    animation: orbit 1.1s linear infinite;
  }
  .loader i:nth-child(2) { animation-delay: -.14s; opacity: .72; }
  .loader i:nth-child(3) { animation-delay: -.28s; opacity: .45; }
  @keyframes orbit {
    from { transform: rotate(0deg) translateX(5.5px); }
    to   { transform: rotate(360deg) translateX(5.5px); }
  }

  .linkbtn {
    margin: 7px auto 0;
    display: block;
    border: 0; background: none; padding: 4px 8px;
    color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
  }
  .linkbtn:hover { color: var(--text); }
  .linkbtn[hidden] { display: none; }

  .tick { color: var(--accent); font-size: 14px; line-height: 1; }
  .countdown { font-variant-numeric: tabular-nums; }
  .is-ok .status { color: var(--accent); }
  .is-err .status { color: var(--danger); }
</style>

<div class="card" id="card">
  <button class="close" id="close" title="Close">&times;</button>
  <div class="top">
    <div class="brand" id="brand"></div>
    <div class="status" id="status">
      <span class="loader"><i></i><i></i><i></i></span>
      <span id="statusText">Waiting to connect</span>
    </div>
  </div>
  <h1 id="title">Connect in your browser</h1>
  <p class="body" id="body">Sign in and approve access there. Chitragupta will update when the connection is ready.</p>
  <button class="action" id="action"></button>
  <button class="linkbtn" id="cancel">Cancel sign-in</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const provider = params.get("provider") || "";
  const brandName = params.get("brand") || provider;
  const authUrl = params.get("auth_url") || "";
  const LIMIT_MS = Number(params.get("limit") || 180) * 1000;

  const ICONS = {
    xai: '<svg viewBox="0 0 24 24"><path d="M3 21 10.5 12 3 3h4.2l5.3 6.4L17.9 3H21l-7.5 9L21 21h-4.2l-5.4-6.5L6.1 21z"/></svg>',
    openai: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3.2a6.8 6.8 0 1 1 0 13.6 6.8 6.8 0 0 1 0-13.6z"/></svg>',
    claude: '<svg viewBox="0 0 24 24"><path d="M12 2 4 20h3.4l1.7-4h5.8l1.7 4H20L12 2zm-1.7 11L12 8.6 13.7 13z"/></svg>',
    cursor: '<svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.4 6.6 3.7L12 11.8 5.4 8.1 12 4.4zM5 9.8l6 3.4v6.3l-6-3.3V9.8zm8 9.7v-6.3l6-3.4v6.4l-6 3.3z"/></svg>',
  };
  const EXT = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  const $ = (id) => document.getElementById(id);
  $("brand").innerHTML = ICONS[provider] || ICONS.cursor;
  $("title").textContent = `Connect ${brandName} in your browser`;

  const api = (p, o) => fetch(p, o).then((r) => r.json());
  const bridge = () => window.pywebview?.api;

  // The card is as tall as its copy, and the copy changes with the provider and
  // the state. Trim the window to match, so there is no dead strip below the
  // card quietly swallowing clicks meant for whatever is behind it. Declared
  // after `bridge`, which it reads — the ordering trap that cost a day already.
  const fit = () => {
    const h = Math.ceil(document.querySelector(".card").getBoundingClientRect().height);
    if (h > 0) bridge()?.fit?.(h);
  };
  window.addEventListener("pywebviewready", fit);
  // Text metrics decide the card's height, and the first measurement lands
  // before the system font is ready — three pixels short, enough to clip the
  // cancel link. Measure again once the font is in.
  if (document.fonts?.ready) document.fonts.ready.then(fit);
  // Watch the card rather than calling fit() from each place that rewrites the
  // copy: every state already changes the text, and one missed call leaves the
  // card clipped against a window that no longer matches it.
  new ResizeObserver(fit).observe(document.querySelector(".card"));

  let done = false;
  const started = Date.now();

  function setAction(label, kind, onClick) {
    const btn = $("action");
    btn.className = "action" + (kind === "primary" ? " primary" : "");
    btn.innerHTML = (kind === "link" ? EXT : "") + `<span>${label}</span>`;
    btn.onclick = onClick;
  }

  setAction("Open browser sign in", "link", () => {
    if (authUrl) api("/api/open-browser", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: authUrl }),
    });
  });

  const cancelSignin = async () => {
    done = true;                                   // stop the poll immediately
    try { await api(`/api/providers/${provider}/auth/cancel`, { method: "POST" }); } catch (_) {}
    (bridge()?.cancel_signin?.(provider)) ?? bridge()?.close_hud?.();
  };
  $("close").onclick = cancelSignin;               // dismissing IS cancelling
  $("cancel").onclick = cancelSignin;

  function succeed(email) {
    done = true;
    $("cancel").hidden = true;
    $("card").className = "card is-ok";
    $("status").innerHTML = `<span class="tick">&#10003;</span><span>Connected</span>`;
    $("title").textContent = `${brandName} is connected`;
    $("body").textContent = email
      ? `Signed in as ${email}. You can use ${brandName} in Chitragupta now.`
      : `You can use ${brandName} in Chitragupta now.`;
    setAction("Return to Chitragupta", "primary", () => bridge()?.focus_main?.());
  }

  function fail(message) {
    done = true;
    $("cancel").textContent = "Close";
    $("card").className = "card is-err";
    $("status").innerHTML = `<span>&#9888;</span><span>Sign-in timed out</span>`;
    $("title").textContent = `Couldn't connect ${brandName}`;
    $("body").textContent = message;
    setAction("Try again", "primary", async () => {
      const r = await api(`/api/providers/${provider}/auth/start`, { method: "POST" }).catch(() => null);
      if (r && r.auth_url) location.search =
        `?provider=${provider}&brand=${encodeURIComponent(brandName)}` +
        `&auth_url=${encodeURIComponent(r.auth_url)}&limit=${LIMIT_MS / 1000}`;
      else location.reload();
    });
  }

  (async function poll() {
    while (!done) {
      const left = LIMIT_MS - (Date.now() - started);
      if (left <= 0) {
        fail(`We waited ${Math.round(LIMIT_MS / 1000)} seconds. Finish signing in, then start again from Models & Accounts.`);
        return;
      }
      if (left < 30_000) {
        $("statusText").innerHTML =
          `Waiting to connect <span class="countdown">&middot; ${Math.ceil(left / 1000)}s</span>`;
      }
      try {
        const st = await api(`/api/providers/${provider}/auth/status`);
        if (st.status === "success") {
          await api(`/api/providers/${provider}/refresh`, { method: "POST" }).catch(() => {});
          succeed(st.email);
          return;
        }
        if (st.status === "error" && st.error) { fail(st.error); return; }
      } catch (_) { /* keep waiting */ }
      await new Promise((r) => setTimeout(r, 1200));
    }
  })();
</script>
