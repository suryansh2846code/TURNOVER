name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest   # the only supported platform (see CLAUDE.md)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install
        # `-e .` alone installs the base package, and the Google SDK is an
        # optional extra — so `google_auth.get_credentials()` raised
        # ModuleNotFoundError here while passing on any developer machine that
        # happened to have it. The suite needs the real Google auth path (the
        # connector SDKs are faked in tests/connectors/harness.py; this one is
        # not), so the extra has to be installed rather than the test skipped.
        #
        # `gdrive` is the whole shared Google stack — gmail/gcal/gdrive all go
        # through google_auth.py, so installing one connector's extra to fix a
        # shared-auth failure would only look right by accident.
        #
        # NOT `.[all]`: it drags in sentence-transformers, and torch is 505 MB
        # for a job that already forces CHITRAGUPTA_EMBEDDING_PROVIDER=hash. It is
        # also not "all" — it omits python-docx and python-pptx.
        #
        # `desktop` is here for the tests, not the app. Without pywebview there
        # is no AppKit, and `tests/test_signin_hud_window.py` opens with a
        # module-level `importorskip` — so its 20 tests collapsed into a single
        # skip line and the macOS window behaviour they pin (float level, Spaces
        # collection, not stealing focus) went unchecked on the one runner that
        # can actually check it.
        run: |
          uv venv
          uv pip install -e ".[gdrive,desktop]"
          uv pip install pytest pytest-cov ruff mypy

      - name: Lint
        run: uv run ruff check chitragupta tests

      - name: Types
        # Strict on the modules that are contracts (the security boundary, the
        # concurrency lanes, the error taxonomy); the grandfathered list in
        # pyproject.toml only ever gets shorter. See [tool.mypy] there.
        run: uv run mypy chitragupta

      - name: Frontend syntax
        run: node --check chitragupta/web/app.js

      - name: Tests
        # Coverage prints, it does not gate. No threshold — a percentage invites
        # tests written to raise it. The per-module table is the point: it says
        # which code a change is moving, protected or not.
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered
        env:
          # Never touch a real credential store or a developer's home.
          CHITRAGUPTA_MODEL_PROVIDER: mock
          CHITRAGUPTA_EMBEDDING_PROVIDER: hash
